; modelsim.ini - Questa Sim configuration for noc_vip
[Library]
work = work
noc_vip_lib = noc_vip_lib
uvm_pkg = $MODEL_TECH/../verilog_src/uvm-1.2

[vsim]
; Default UVM verbosity
UVM_VERBOSITY = UVM_MEDIUM
; Random seed (0 = random)
sv_seed = 0
; Resolution
Resolution = ps
; Coverage
Coverage = sbceft
